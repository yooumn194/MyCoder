[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corecoder"
version = "0.4.0"
description = "Minimal AI coding agent (~1,000 lines of Python) inspired by Claude Code. Works with any LLM. (formerly NanoCoder)"
readme = "README.md"
license = "MIT"
# Floor is 3.11 because the sandbox executor (corecoder/sandbox) uses
# asyncio.TaskGroup (PEP 654, Python 3.11+); the project venv is 3.12.0.
requires-python = ">=3.11"
authors = [
    { name = "Yufeng He", email = "40085740+he-yufeng@users.noreply.github.com" },
]
keywords = ["ai", "agent", "coding", "cli", "llm", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "structlog>=24.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["corecoder"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
sandbox = ["docker>=7.0.0"]
# MCP SSE transport only — stdio MCP works with the standard library alone.
# aiohttp is imported lazily, so a pure-stdio install never pays for it.
sse = ["aiohttp>=3.9"]
mcp = ["aiohttp>=3.9"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23.0", "ruff>=0.9.0", "aiohttp>=3.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
corecoder = "corecoder.cli:main"

[project.urls]
Homepage = "https://github.com/he-yufeng/CoreCoder"
Repository = "https://github.com/he-yufeng/CoreCoder"
Issues = "https://github.com/he-yufeng/CoreCoder/issues"

[tool.ruff]
line-length = 130
target-version = "py311"
