[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycoder"
version = "0.5.0"
description = "Framework-free AI coding agent with sandboxing, memory, multi-agent orchestration, MCP, and evaluation."
readme = "README.md"
license = "MIT"
# Floor is 3.11 because the sandbox executor (mycoder/sandbox) uses
# asyncio.TaskGroup (PEP 654, Python 3.11+); the project venv is 3.12.0.
requires-python = ">=3.11"
authors = [
    { name = "zzc", email = "yooumn@163.com" },
]
keywords = ["ai", "agent", "coding", "cli", "llm", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "structlog>=24.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mycoder", "api", "eval_bench"]

[tool.hatch.build.targets.wheel.force-include]
"config/model_routing.yaml" = "mycoder/config_data/model_routing.yaml"
"config/memory.yaml" = "mycoder/config_data/memory.yaml"
"config/mcp_servers.yaml" = "mycoder/config_data/mcp_servers.yaml"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "redis>=5.0", "httpx>=0.27"]
litellm = ["litellm>=1.60.0,<2.0.0"]
sandbox = ["docker>=7.0.0"]
# MCP SSE transport only — stdio MCP works with the standard library alone.
# aiohttp is imported lazily, so a pure-stdio install never pays for it.
sse = ["aiohttp>=3.9"]
mcp = ["aiohttp>=3.9"]
# Phase 5 memory: everything is optional + lazily imported. `memory` gives the
# word-segmentation + token-count + numpy vector path; the heavier backends are
# opt-in extras that still degrade cleanly when absent.
memory = ["jieba", "numpy", "tiktoken"]
memory-vec = ["sqlite-vec>=0.1.0"]
memory-embed = ["fastembed>=0.3.0"]
memory-embed-torch = ["sentence-transformers>=2.7.0"]
# LLM observability: tiktoken estimates token counts when the provider omits usage.
observability = ["tiktoken"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23.0", "ruff>=0.9.0", "aiohttp>=3.9", "jieba", "numpy", "tiktoken"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
mycoder = "mycoder.cli:main"
mycoder-api = "api.__main__:main"
mycoder-bench = "eval_bench.runner:main"
mycoder-score = "eval_bench.scorer:main"

[project.urls]
Homepage = "https://github.com/yooumn194/MyCoder"
Repository = "https://github.com/yooumn194/MyCoder"
Issues = "https://github.com/yooumn194/MyCoder/issues"

[tool.ruff]
line-length = 130
target-version = "py311"
