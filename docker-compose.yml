# MyCoder service-layer prototype: FastAPI + Redis session backend.
#
#   docker compose up --build
#   curl localhost:8000/health
#
# The api container reads the LLM key from the host env (MYCODER_API_KEY /
# OPENAI_API_KEY); without a key /v1/agent/run returns 503.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      STATE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      MYCODER_API_KEY: ${MYCODER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
