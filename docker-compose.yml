# MyCoder service-layer prototype: FastAPI + Redis session backend.
#
#   docker compose up --build
#   curl localhost:8000/health
#
# The api container reads the LLM key from the host env (MYCODER_API_KEY /
# OPENAI_API_KEY); without a key /v1/agent/run returns 503.

services:
  api:
    build: .
    ports:
      - "${MYCODER_API_BIND:-127.0.0.1}:8000:8000"
    environment:
      STATE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      MYCODER_API_KEY: ${MYCODER_API_KEY:-}
      MYCODER_PROFILE: ${MYCODER_PROFILE:-}
      MYCODER_PROVIDER: ${MYCODER_PROVIDER:-}
      MYCODER_OPENROUTER_MODEL: ${MYCODER_OPENROUTER_MODEL:-}
      MYCODER_DEEPSEEK_MODEL: ${MYCODER_DEEPSEEK_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MYCODER_API_KEYS: ${MYCODER_API_KEYS:-}
      MYCODER_REQUIRE_AUTH: ${MYCODER_REQUIRE_AUTH:-true}
      MYCODER_WORKSPACE_ROOT: /workspaces
    volumes:
      - ./workspaces:/workspaces
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
