name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11+ : the sandbox executor uses asyncio.TaskGroup (PEP 654).
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      # ripgrep for the live rg-backend tests (they skip when rg is absent).
      - name: Install ripgrep
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)  sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS)  brew install ripgrep ;;
            Windows) choco install ripgrep -y ;;
          esac

      - name: Run tests
        run: python -m pytest tests/ -v

      # P1-1: evaluation benchmark — reports only, never blocks merges.
      - name: Run Phase 4 Evaluation
        run: |
          python -m mycoder.eval.runner --benchmark orchestration --cases 20 \
            --report eval-report.json
        continue-on-error: true

      - name: Compile
        run: python -m compileall -q mycoder tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: python -m pip install -U pip ruff

      - name: Ruff check
        run: ruff check mycoder tests
