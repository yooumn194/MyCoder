name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11+ : the sandbox executor uses asyncio.TaskGroup (PEP 654).
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: python -m pip install -U pip uv

      - name: Install locked dependencies
        run: |
          uv sync --frozen --python "${{ matrix.python-version }}" --extra api --extra dev --extra sandbox

      # ripgrep for the live rg-backend tests (they skip when rg is absent).
      - name: Install ripgrep
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)  sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS)  brew install ripgrep ;;
            Windows) choco install ripgrep -y ;;
          esac

      - name: Run tests
        run: uv run --frozen python -m pytest tests/ -v

      - name: Validate evaluation dataset
        run: uv run --frozen python -m eval_bench.runner --dry-run

      - name: Compile
        run: uv run --frozen python -m compileall -q mycoder api eval_bench tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify wheel contents from an isolated directory
        shell: bash
        run: |
          python -m venv /tmp/mycoder-wheel-smoke
          /tmp/mycoder-wheel-smoke/bin/python -m pip install -U pip
          /tmp/mycoder-wheel-smoke/bin/python -m pip install dist/*.whl fastapi uvicorn redis httpx
          cd /tmp
          /tmp/mycoder-wheel-smoke/bin/python -c "import api, eval_bench, mycoder"
          /tmp/mycoder-wheel-smoke/bin/python -c "from mycoder.resources import config_path; assert all(config_path(name).is_file() for name in ('model_routing.yaml', 'memory.yaml', 'mcp_servers.yaml'))"
          /tmp/mycoder-wheel-smoke/bin/mycoder --help
          /tmp/mycoder-wheel-smoke/bin/mycoder-api --help
          /tmp/mycoder-wheel-smoke/bin/mycoder-bench --dry-run
          /tmp/mycoder-wheel-smoke/bin/mycoder-score --help
          /tmp/mycoder-wheel-smoke/bin/mycoder-swebench --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lint tools
        run: python -m pip install -U pip ruff uv

      - name: Check dependency lock
        run: uv lock --check

      - name: Ruff check
        run: ruff check mycoder api eval_bench tests

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install -U pip uv
      - name: Install locked integration dependencies
        run: uv sync --frozen --python "3.12" --extra api --extra dev
      - name: Run real Redis integration tests
        env:
          MYCODER_TEST_REDIS_URL: redis://localhost:6379/15
        run: uv run --frozen python -m pytest tests/test_redis_integration.py -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build service image
        run: docker build --tag mycoder-ci .

  docker-integration:
    # Keep real-container tests out of the cross-platform unit-test matrix:
    # GitHub-hosted macOS/Windows runners do not guarantee a Docker daemon,
    # while ubuntu-latest provides one.  Building the exact image used by
    # DockerSandbox turns the integration suite from an always-skipped smoke
    # test into a CI gate for isolation, timeout and teardown regressions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install -U pip uv
      - name: Install locked dependencies
        run: uv sync --frozen --python "3.12" --extra api --extra dev --extra sandbox
      - name: Check Docker daemon
        run: docker info
      - name: Build sandbox image
        run: docker build --tag mycoder-sandbox:3.12 -f sandbox/Dockerfile sandbox/
      - name: Run real Docker sandbox tests
        run: uv run --frozen python -m pytest tests/test_sandbox_docker.py -v -rs
